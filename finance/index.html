<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<!-- Private money planner. Static shell only: every number comes from /api/ideas?finance=data, which needs the admin passkey session. -->
<base href="/finance/">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- 📱 تطبيق على الشاشة الرئيسية للآيفون (Safari ← مشاركة ← Add to Home Screen): بيفتح شاشة كاملة، والدخول بالـPasskey بتاعك بس -->
<link rel="manifest" href="/finance/manifest.webmanifest">
<link rel="apple-touch-icon" href="/finance/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="فلوسي">
<meta name="theme-color" content="#14213D">
<title>فلوسي — مدير فلوسك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=tide3">
  <script src="/js/tools/icons.js?v=2" defer></script>
</head>
<body class="first">
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<main class="app">
  <nav class="nav glass" id="nav" aria-label="التنقل">
    <a class="back" href="/admin" aria-label="رجوع للأدمن" title="رجوع للأدمن · Back to Admin">← 🏠</a>
    <b class="logo">🪙 فلوسي</b>
    <div class="tabs"><button type="button" data-page="home" class="on">🏠 الرئيسية</button><button type="button" data-page="stats">📊 التحليلات</button><button type="button" data-page="log">📒 السجل</button></div>
    <button type="button" id="lang" class="lang" aria-label="اللغة">English</button>
  </nav>
  <aside class="chat glass" id="chat">
    <header class="chat-head">
      <div class="agent" id="agent" aria-hidden="true"><svg viewBox="0 0 64 64"><defs><radialGradient id="ag" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#B5C1DB"/><stop offset=".6" stop-color="#768CBB"/><stop offset="1" stop-color="#445A89"/></radialGradient></defs><path d="M25 12 L37 -1 Q39 7 41 13 Z" fill="#445A89"/><circle cx="32" cy="35" r="27" fill="url(#ag)" stroke="#374A71" stroke-width="2.5"/><ellipse cx="32" cy="47" rx="19" ry="11" fill="#F7F1E7"/><g stroke="#374A71" stroke-width="1.6" stroke-linecap="round" opacity=".55"><path d="M10 31 q2 3 0 6"/><path d="M13 30 q2 3 0 6"/><path d="M54 31 q-2 3 0 6"/><path d="M51 30 q-2 3 0 6"/></g><g class="eyes"><ellipse cx="23" cy="29" rx="3.6" ry="4.6" fill="#152238"/><ellipse cx="41" cy="29" rx="3.6" ry="4.6" fill="#152238"/><circle cx="24.3" cy="27.4" r="1.2" fill="#fff"/><circle cx="42.3" cy="27.4" r="1.2" fill="#fff"/></g><g class="mouth"><path d="M21 42 Q32 53 43 42 Z" fill="#152238"/><path d="M23 43 l2.5 3 2.5 -2.6 2.5 3 2.5 -3 2.5 3 2.5 -2.6 2.5 3 1.5 -3.8 Z" fill="#fff"/></g><circle cx="16" cy="39" r="3" fill="#FF6B5B" opacity=".4"/><circle cx="48" cy="39" r="3" fill="#FF6B5B" opacity=".4"/></svg></div>
      <div class="grow"><b>قرش 🦈</b><small class="agent-role">مستشارك المالي 🤖</small><small id="saveInfo" class="save-info"></small></div>
      <div class="ch-tools">
        <button id="imp" class="pill" type="button" aria-label="استيراد البيانات" title="استيراد البيانات">📥</button>
        <button id="exp" class="pill" type="button" aria-label="تصدير البيانات" title="تصدير البيانات">📤</button>
        <input id="impFile" type="file" accept="application/json,.json" hidden>
        <button id="ctl" class="pill" type="button" aria-label="التحكم" title="التحكم">🎛</button>
        <button id="mute" class="pill" type="button" aria-label="الصوت" title="الصوت">🔊</button>
      </div>
      <div class="ch-mkt" id="rateInfo"><span class="mk-load">بجيب الأسعار…</span></div>
    </header>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <form class="say" id="say" autocomplete="off">
      <input id="sayIn" inputmode="text" placeholder="اكتب هنا… مثال: 2000 أو 500 جنيه" aria-label="اكتب ردّك">
      <button aria-label="ابعت">➤</button>
    </form>
  </aside>

  <section class="col">
    <div class="today glass" id="today" hidden></div>
    <div class="stage glass" id="stage">
      <div class="view" id="view">
        <canvas id="gl"></canvas>
        <div class="stage-top">
          <div class="brand"><h1>فلوسي</h1><span class="cyc" id="cycle"></span></div>
          <div class="total"><div class="trow"><button id="eye" class="eye" type="button" aria-label="إظهار أو إخفاء الأرقام" title="إظهار أو إخفاء الأرقام">🙈</button><small>إجمالي اللي معاك</small></div><b><span id="total">0</span> <span class="sym">Đ</span></b><em id="totalAlt"></em></div>
        </div>
        <div id="labels"></div>
        <div id="fx" aria-hidden="true"></div>
        <div id="why" class="pop" hidden></div>
      </div>
      <div class="foot" id="foot"></div>
    </div>
    <div id="cards"></div>
    <div id="stats" class="stats-page" hidden></div>
    <div id="logs" class="log-page" hidden></div>
  </section>
</main>

<div id="pin" class="pin" hidden>
  <form id="pinForm" class="glass" autocomplete="off">
    <b id="pinMsg">اكتب الرقم السري</b>
    <input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="الرقم السري">
    <small id="pinErr"></small>
    <div class="pin-btns"><button class="btn primary">تمام</button><button class="btn ghost" type="button" data-cancel>إلغاء</button></div>
  </form>
</div>
<div id="ctlBox" class="pin" hidden>
  <form id="ctlForm" class="glass ctl" autocomplete="off">
    <b id="ctlTitle">🎛 التحكم</b>
    <label class="ctl-row"><span><span id="ctlSoundL">🔊 أصوات الموقع</span><small id="ctlSoundS">نقرات وتنبيهات، مجانًا</small></span><input type="checkbox" id="ctlSound"></label>
    <label class="ctl-row"><span><span id="ctlVoiceL">🗣 صوت قرش وكتابة كلامك</span><small id="ctlVoiceS">ElevenLabs، بفلوس</small></span><input type="checkbox" id="ctlVoice"></label>
    <label class="ctl-row"><span><span id="ctlAiL">🤖 الذكاء الاصطناعي</span><small id="ctlAiS">Claude، بفلوس</small></span><input type="checkbox" id="ctlAi"></label>
    <small id="ctlNote"></small>
    <div class="pin-btns"><button class="btn primary" type="button" data-ctlclose>تمام</button></div>
  </form>
</div>
<div id="tip" class="tip" hidden></div>
<div id="toast" class="toast" role="status"></div>
<!-- security snapshots on repeated wrong PINs (site only) -->
<script type="module" src="app.js"></script>
</body>
</html>

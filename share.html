<!DOCTYPE html>
<!--
  A client's read-only view of their own hours, at /c/<token>. No login: the
  token in the URL is the credential, so it is unguessable and revocable.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your hours — Ahmed Tarek</title>
  <meta name="robots" content="noindex, nofollow" />
  <!-- Google looks for /favicon.ico at the root before anything declared here,
       and it wants a square in a multiple of 48px — which 32 and 64, what this
       used to offer, are not. Hence both: the .ico for the crawler and the old
       convention, the 96 and 192 for everything modern. -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="96x96" href="/logo/icon-96.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/logo/icon-192.png">
  <link rel="apple-touch-icon" href="/logo/favicon-180.png">
  <meta name="theme-color" content="#161826" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tools/app.css?v=12" />
  <link rel="stylesheet" href="/css/tools/go.css?v=14" />
</head>
<body>
  <div class="wrap">

    <section id="view-loading" class="view go-loader-view">
      <div class="go-loader" role="status" aria-live="polite">
        <svg class="go-loader__mark" viewBox="0 0 120 120" aria-hidden="true">
          <ellipse class="go-loader__shadow" cx="60" cy="104" rx="38" ry="5"></ellipse>
          <path class="go-loader__track" d="M20 94 L60 26 L100 94"></path>
          <path class="go-loader__climb" d="M20 94 L60 26"></path>
          <circle class="go-loader__peak" cx="60" cy="26" r="9.5"></circle>
        </svg>
        <p class="go-loader__text">Loading…</p>
      </div>
    </section>

    <section id="view-error" class="view" hidden>
      <div class="card card--center login-card">
        <h1>Link not valid</h1>
        <p class="muted" id="errorMsg">This link is not valid anymore. Please ask for a new one.</p>
      </div>
    </section>

    <section id="view-share" class="view" hidden>
      <header class="topbar">
        <div class="client-head">
          <div class="avatar avatar--lg" id="cAvatar"></div>
          <div>
            <h1 id="cName"></h1>
            <p class="muted" style="font-size:.85rem">Training hours overview · read-only</p>
          </div>
        </div>
      </header>

      <section class="agenda" id="agenda" hidden>
        <div id="meetingHero"></div>
        <div class="meet-grid" id="meetingList"></div>
        <p class="muted agenda__note" id="agendaZone"></p>
      </section>

      <div class="tiles" id="tiles"></div>

      <div class="card">
        <div class="card__head">
          <h2>Hours balance</h2>
          <div class="chart-key muted">
            <span><i class="key key--purchase"></i>purchase</span>
            <span><i class="key key--session"></i>session</span>
            <span><i class="key key--expiry"></i>expiry</span>
          </div>
        </div>
        <div class="chart-filter" id="chartFilter">
          <button type="button" class="chip chip--on" data-range="all">All</button>
          <button type="button" class="chip" data-range="30">30d</button>
          <button type="button" class="chip" data-range="90">90d</button>
          <button type="button" class="chip" data-range="365">1y</button>
          <span class="chart-filter__dates">
            <input type="date" name="from" aria-label="From date" />
            <span class="muted">→</span>
            <input type="date" name="to" aria-label="To date" />
          </span>
        </div>
        <div id="chart" class="chart"></div>
        <div id="chartTip" class="tooltip" hidden></div>
        <div id="chartDetail" class="chart-detail" hidden></div>
      </div>

      <div class="cols">
        <div class="card">
          <div class="card__head"><h2>Hours purchased</h2></div>
          <div class="table-scroll">
            <table class="table" id="packagesTable">
              <thead><tr><th>Bought</th><th class="num">Hours</th><th>Expires</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <div class="card__head"><h2>Sessions</h2></div>
          <div class="table-scroll">
            <table class="table" id="sessionsTable">
              <thead><tr><th>Date</th><th class="num">Hours</th><th>Topic</th><th>File</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>

      <p class="muted center" style="font-size:.8rem; margin-top:6px">
        Shared by <a href="https://ahmedtarek.tech" style="color:var(--blue-2)">Ahmed Tarek</a>
      </p>
    </section>

  </div>

  <script src="/js/tools/chart.js?v=19"></script>
  <script src="/js/tools/meetings.js?v=3"></script>
  <script src="/js/tools/files.js?v=1"></script>
  <script src="/js/tools/share.js?v=6"></script>
</body>
</html>

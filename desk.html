<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- The product desk: one inbox for bugs, requests and ideas across every
       product, graded by rule and laid over a weekly fix day. Static shell
       only; the logic and the reasons for it are in js/tools/desk.js. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#14213D" />
  <title>Product desk</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="96x96" href="/logo/icon-96.png">
  <script>
    // set the theme before first paint, the same way the other tools do
    (function () {
      try {
        var saved = localStorage.getItem("tools-theme");
        if (saved === "light") document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    })();
  </script>
  <script src="js/tools/i18n.js?v=1"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Quicksand:wght@500;600;700&family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tools/app.css?v=15" />
  <link rel="stylesheet" href="css/tools/desk.css?v=35" />
  <link rel="stylesheet" href="css/tools/tide.css?v=5" />
  <script src="/js/tools/icons.js?v=2" defer></script>
</head>
<body>

  <div class="wrap">

    <section id="view-loading" class="view">
      <p class="muted center" data-ar="بيحمّل…">Loading…</p>
    </section>

    <section id="view-app" class="view" hidden>
      <header class="topbar">
        <h1 class="desk-title"><span class="desk-ico desk-ico--xl" aria-hidden="true">🎫</span><span data-ar="مكتب المنتجات">Product desk</span></h1>
        <div class="topbar__actions">
          <button id="btnAdd" class="btn btn--primary btn--sm" data-ar="+ سجّل حاجة">+ Log something</button>
          <a class="btn btn--ghost btn--sm" href="/admin" data-ar="→ الرئيسية">← Home</a>
          <a class="btn btn--ghost btn--sm" href="/time" data-ar="الوقت">Time</a>
          <button id="btnSound" class="btn btn--ghost btn--sm theme-toggle" type="button" aria-label="Turn sound off">🔊</button>
          <button id="btnTheme" class="btn btn--ghost btn--sm theme-toggle" aria-label="Toggle light/dark theme">🌙</button>
        </div>
      </header>

      <nav class="desk-tabs" id="tabbar">
        <button type="button" class="tab tab--active" data-tab="today"><i class="desk-ico" aria-hidden="true">📅</i><span data-ar="النهارده">Today</span><i class="tab__count" hidden></i></button>
        <button type="button" class="tab" data-tab="fix"><i class="desk-ico" aria-hidden="true">🛠️</i><span data-ar="يوم التصليح">Fix day</span><i class="tab__count" hidden></i></button>
        <button type="button" class="tab" data-tab="later"><i class="desk-ico" aria-hidden="true">⏳</i><span data-ar="بعدين">Later</span><i class="tab__count" hidden></i></button>
        <button type="button" class="tab" data-tab="numbers"><i class="desk-ico" aria-hidden="true">📈</i><span data-ar="الأرقام">Numbers</span><i class="tab__count" hidden></i></button>
        <button type="button" class="tab" data-tab="done"><i class="desk-ico" aria-hidden="true">✅</i><span data-ar="اتقفلت">Closed</span></button>
        <button type="button" class="tab" data-tab="products"><i class="desk-ico" aria-hidden="true">📦</i><span data-ar="المنتجات">Products</span></button>
        <button type="button" class="tab" data-tab="rules"><i class="desk-ico" aria-hidden="true">⚙️</i><span data-ar="القواعد">Rules</span></button>
      </nav>

      <div id="panel"></div>
    </section>

  </div>

  <div class="desk-wiz" id="wizard" hidden>
    <div class="desk-wiz__card" id="wizardBody" role="dialog" aria-modal="true" aria-label="Log something"></div>
  </div>

  <div class="desk-tix" id="ticket" hidden>
    <div class="desk-tix__scene">
      <div class="desk-tix__in" id="ticketIn">
        <div class="desk-tix__tilt" id="ticketTilt">
          <article class="desk-tix__card" id="ticketCard" role="dialog" aria-modal="true" aria-label="Ticket"></article>
        </div>
      </div>
      <div class="desk-tix__acts">
        <button class="btn btn--primary btn--sm" type="button" id="ticketCopy" data-ar="انسخ التذكرة">Copy ticket</button>
        <button class="btn btn--ghost btn--sm" type="button" id="ticketClose" data-ar="قفل">Close</button>
      </div>
    </div>
  </div>

  <div class="desk-view" id="shotView" hidden>
    <div class="desk-view__body" id="shotViewBody" role="dialog" aria-modal="true" aria-label="Pictures"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script>I18N.apply(document);</script>
  <script src="js/tools/theme.js?v=5"></script>
  <script src="js/tools/desk.js?v=43"></script>
</body>
</html>

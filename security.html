<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- The security log: failed logins and wrong finance PINs, with the camera
       frame taken at the time. Static shell only — the entries come from
       /api/auth?action=snaps, which needs the admin passkey session AND the
       security passcode, asked on every open (kept in memory only). -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Security log</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <script src="js/tools/i18n.js?v=1"></script>
  <style>
    :root { color-scheme: dark; --bg: #0f1117; --card: #181b24; --line: #2a2f3d; --ink: #eef0f6; --mute: #9aa3b5; --bad: #f87171; --ok: #34d399; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
    main { max-width: 980px; margin: 0 auto; padding: 20px 16px 80px; }
    header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
    h1 { font-size: 1.4rem; margin: 0; flex: 1; min-width: 180px; }
    p.sub { color: var(--mute); margin: 0 0 18px; }
    a.btn, button.btn { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
    button.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, transparent); }
    a.btn:hover, button.btn:hover { background: rgba(255, 255, 255, .07); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .snap { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
    .snap img, .snap .none { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: #000; }
    .snap .none { display: grid; place-items: center; color: var(--mute); font-size: .9rem; text-align: center; padding: 10px; }
    .snap div.meta { padding: 10px 12px 12px; }
    .snap b { display: block; }
    .snap small { display: block; color: var(--mute); overflow-wrap: anywhere; unicode-bidi: plaintext; }
    .tag { display: inline-block; font-size: .75rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); margin-bottom: 4px; }
    .snap .acts { margin-top: 8px; }
    .snap .acts .btn, #blocks .btn { padding: 4px 12px; font-size: .85rem; }
    .you { color: var(--ok); font-weight: 700; }
    #blocks { margin-bottom: 18px; }
    #blocks h2 { font-size: 1rem; margin: 0 0 8px; }
    #blocks ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
    #blocks li { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); }
    #blocks code { direction: ltr; unicode-bidi: isolate; }
    #lock { max-width: 340px; margin: 40px auto; padding: 22px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; text-align: center; }
    #lock b { display: block; font-size: 1.1rem; margin-bottom: 12px; }
    #lock input { width: 100%; padding: 12px; font: inherit; font-size: 1.4rem; letter-spacing: .3em; text-align: center; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; direction: ltr; }
    #lock small { display: block; min-height: 1.4em; margin: 8px 0; color: var(--bad); }
    #lock button { width: 100%; }
    .shake { animation: shake .35s; }
    @keyframes shake { 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }
    .empty { padding: 40px 16px; text-align: center; color: var(--mute); border: 1px dashed var(--line); border-radius: 16px; }
  </style>
</head>
<body>
<main>
  <header>
    <a class="btn" href="/admin" data-ar="→ الأدمن">← Admin</a>
    <h1 data-ar="سجل الأمان">Security log</h1>
    <button class="btn danger" id="clear" type="button" hidden data-ar="امسح السجل">Clear log</button>
  </header>
  <p class="sub" data-ar="أي محاولة دخول أو رقم سري غلط مرتين بتتسجل هنا: الوقت، الصورة، وعنوان الـIP. تقدر تحظر أي عنوان من الدخول. بنحتفظ بآخر 60 محاولة.">Two failed logins, or two wrong PINs, are recorded here: the time, the photo and the IP address. You can block any address from signing in. The newest 60 are kept.</p>
  <form id="lock" hidden autocomplete="off">
    <b data-ar="🔒 اكتب الرقم السري">🔒 Enter the passcode</b>
    <input id="code" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="Passcode">
    <small id="codeErr"></small>
    <button class="btn" type="submit" data-ar="افتح">Open</button>
  </form>
  <div id="blocks"></div>
  <div id="list" class="grid"></div>
</main>
<script src="js/tools/snap.js?v=3"></script>
<script>
(function () {
  "use strict";
  var list = document.getElementById("list"), clearBtn = document.getElementById("clear"), blocksEl = document.getElementById("blocks");
  var KIND = { login: T("Failed login", "دخول فاشل"), pin: T("Wrong finance PIN", "رقم سري غلط في الفلوس") };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return "&#" + c.charCodeAt(0) + ";"; }); }
  function empty(msg) { list.className = ""; list.innerHTML = '<div class="empty">' + esc(msg) + "</div>"; }
  // the passcode unlock lives only in this variable: a refresh or new tab asks again
  var unlock = "", lock = document.getElementById("lock"), codeIn = document.getElementById("code"), codeErr = document.getElementById("codeErr");
  function call(url, opts) {
    opts = opts || {};
    opts.cache = "no-store";
    opts.headers = Object.assign({ "X-Security-Unlock": unlock }, opts.headers || {});
    return fetch(url, opts).then(function (r) {
      // not signed in: the admin page is where the passkey prompt lives
      if (r.status === 401) { location.replace("/admin"); return null; }
      if (r.status === 423) { showLock(); return null; }
      return r;
    });
  }
  function showLock() {
    unlock = ""; list.innerHTML = ""; blocksEl.innerHTML = ""; clearBtn.hidden = true;
    lock.hidden = false; codeIn.value = ""; codeIn.focus();
  }
  lock.addEventListener("submit", function (e) {
    e.preventDefault();
    var code = codeIn.value.trim();
    if (!code) return;
    fetch("/api/auth?action=security-unlock", { method: "POST", cache: "no-store", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: code }) })
      .then(function (r) {
        if (r.status === 401) { location.replace("/admin"); return; }
        return r.json().catch(function () { return {}; }).then(function (d) {
          if (r.ok && d.unlock) {
            unlock = d.unlock; lock.hidden = true; codeErr.textContent = "";
            if (window.Snap) Snap.ok("pin");
            return load();
          }
          // a second wrong code is photographed into this same log
          if (window.Snap) Snap.fail("pin", "security log passcode");
          codeIn.value = "";
          codeErr.textContent = r.status === 429
            ? T("Too many wrong codes. Try again in an hour.", "غلطت كتير. جرّب تاني بعد ساعة.")
            : T("Wrong code", "الرقم غلط") + (d.left != null ? " · " + T(d.left + " tries left", "فاضل " + d.left + " محاولات") : "");
          lock.classList.remove("shake"); void lock.offsetWidth; lock.classList.add("shake");
        });
      }).catch(function () { codeErr.textContent = T("Could not check the code.", "مقدرناش نتأكد من الرقم."); });
  });
  function load() {
    if (!unlock) return showLock();
    call("/api/auth?action=snaps").then(function (r) {
      return r ? r.json() : null;
    }).then(function (d) {
      if (!d) return;
      var snaps = d.snaps || [], blocks = d.blocks || [], you = d.you || "", blocked = {};
      blocks.forEach(function (b) { blocked[b.ip] = true; });
      blocksEl.innerHTML = blocks.length ? "<h2>" + esc(T("Blocked addresses", "العناوين المحظورة")) + "</h2><ul>" + blocks.map(function (b) {
        return "<li><code>" + esc(b.ip) + '</code><button class="btn" type="button" data-unblock="' + esc(b.ip) + '">' + esc(T("Unblock", "فك الحظر")) + "</button></li>";
      }).join("") + "</ul>" : "";
      clearBtn.hidden = !snaps.length;
      if (!snaps.length) return empty(T("Nothing recorded. No one has failed to get in.", "مفيش حاجة متسجلة. محدش حاول يدخل وفشل."));
      list.className = "grid";
      list.innerHTML = snaps.map(function (s) {
        var when = new Date(s.created_at).toLocaleString(I18N.loc("en-GB"), { dateStyle: "medium", timeStyle: "short" });
        // only data: JPEGs are ever stored, but check again before using one as a src
        var ok = typeof s.photo === "string" && s.photo.indexOf("data:image/jpeg;base64,") === 0;
        return '<article class="snap">' +
          (ok ? '<img alt="" src="' + esc(s.photo) + '">' : '<div class="none">' + esc(T("No photo — the camera was not allowed", "مفيش صورة — الكاميرا ما اتسمحش بيها")) + "</div>") +
          '<div class="meta"><span class="tag">' + esc(KIND[s.kind] || s.kind) + "</span><b>" + esc(when) + "</b>" +
          "<small>" + esc(s.page || "") + (s.note ? " · " + esc(s.note) : "") + "</small>" +
          "<small>" + esc(T("IP address", "عنوان الـIP")) + ": " + esc(s.ip || "—") + (s.ip && s.ip === you ? ' <span class="you">(' + esc(T("this is you now", "ده إنت دلوقتي")) + ")</span>" : "") + "</small>" +
          "<small>" + esc(s.ua || "") + "</small>" +
          (s.ip && s.ip !== you ? '<div class="acts">' + (blocked[s.ip]
            ? '<button class="btn" type="button" data-unblock="' + esc(s.ip) + '">' + esc(T("Blocked — unblock", "محظور — فك الحظر")) + "</button>"
            : '<button class="btn danger" type="button" data-block="' + esc(s.ip) + '">' + esc(T("Block this IP", "احظر الـIP ده")) + "</button>") + "</div>" : "") +
          "</div></article>";
      }).join("");
    }).catch(function () { empty(T("Could not load the log.", "السجل ما اتحمّلش.")); });
  }
  clearBtn.addEventListener("click", function () {
    if (!confirm(T("Delete every entry and photo in the log? This cannot be undone.", "تمسح كل المحاولات والصور من السجل؟ مش هينفع ترجّعها."))) return;
    call("/api/auth?action=snaps-clear", { method: "POST" }).then(function (r) { if (r) load(); });
  });
  // block / unblock: a blocked address is refused at every sign-in step
  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-block],[data-unblock]") : null;
    if (!b) return;
    var on = b.hasAttribute("data-block"), ip = b.getAttribute(on ? "data-block" : "data-unblock");
    if (on && !confirm(T("Block " + ip + " from signing in? You can undo this here.", "تحظر " + ip + " من الدخول؟ تقدر تفكه من هنا."))) return;
    call("/api/auth?action=block", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ip: ip, on: on }) })
      .then(function (r) { if (!r) return; if (r.status === 409) alert(T("That is the address you are using right now, so it was not blocked.", "ده العنوان اللي إنت داخل منه دلوقتي، فما اتحظرش.")); load(); });
  });
  load();
})();
</script>
</body>
</html>
